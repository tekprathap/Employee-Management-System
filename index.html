<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="employees-title">Employee Management System</h1>

  <div class="top-bar">
    <button id="addEmployeeBtn">Add Employee</button>
    <input type="text" id="searchInput" placeholder="Search employees...">
    <p>Total Employees: <span id="employeeCount">0</span></p>
  </div>

  <!-- Employee Form -->
  <div id="formContainer" class="form-container" style="display:none;">
    <h2 id="formTitle">Add New Employee</h2>
    <form id="employeeForm">
      <label>Employee ID:</label>
      <input type="text" name="employeeId" required>

      <label>Employer ID:</label>
      <input type="text" name="employerId" required>

      <label>Name:</label>
      <input type="text" name="name" required>

      <label>Email:</label>
      <input type="email" name="email" required>

      <label>Position:</label>
      <input type="text" name="position" required>

      <label>Department:</label>
      <input type="text" name="department" required>

      <label>Salary (₹):</label>
      <input type="number" name="salary" required>

      <label>Phone:</label>
      <input type="text" name="phone" required min="10">

      <label>Join Date:</label>
      <input type="date" name="joinDate" required>

      

      <div class="form-buttons">
        <button type="submit" id="submitBtn">Add Employee</button>
        <button type="button" id="cancelBtn">Cancel</button>
      </div>
    </form>
  </div>

  <!-- Table Section -->
  <div id="tableContainer" class="table-container"></div>

  <script src="script.js"></script>
</body>
</html>
