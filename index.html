<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Management System</title>
  <link rel="stylesheet" href="style.css">
  <!-- SheetJS library for Excel export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>
  <header>
    <h1>👨‍💼 Employee Management System..</h1>
  </header>

  <main>
    <div class="top-bar">
      <input type="text" id="searchInput" placeholder="🔍 Search by Name / Employee ID / Employer ID">
      <div class="btn-group">
        <button id="addEmployeeBtn">+ Add Employee</button>
        <button id="exportBtn" class="export-btn">⬇️ Export Excel</button>
      </div>
    </div>

    <p>Total Employees: <span id="employeeCount">0</span></p>

    <div id="tableContainer" class="table-container"></div>

    <div id="formContainer" class="form-container">
      <h2 id="formTitle">Add New Employee</h2>
      <form id="employeeForm">
        <div class="form-group">
          <label>Employee ID:</label>
          <input type="text" name="employeeId" required>
        </div>
        <div class="form-group">
          <label>Employer ID:</label>
          <input type="text" name="employerId" required>
        </div>
        <div class="form-group">
          <label>Name:</label>
          <input type="text" name="name" required>
        </div>
        <div class="form-group">
          <label>Email:</label>
          <input type="email" name="email" required>
        </div>
        <div class="form-group">
          <label>Position:</label>
          <input type="text" name="position" required>
        </div>
        <div class="form-group">
          <label>Department:</label>
          <input type="text" name="department" required>
        </div>
        <div class="form-group">
          <label>Salary (₹):</label>
          <input type="number" name="salary" required min="10000">
        </div>
        <div class="form-group">
          <label>Phone:</label>
          <input type="text" name="phone">
        </div>
        <div class="form-group">
          <label>Join Date:</label>
          <input type="date" name="joinDate" required>
        </div>
<div class="form-group">
  <label for="">aadharNumber</label>
  <input type="text" name="aadharNumber" id="aadharNumber" placeholder="Aadhar Number">

</div>
<div class="form-group">
  <label for="">bankAccountNumber</label>
  <input type="text" name="bankAccountNumber" id="bankAccountNumber" placeholder="Bank Account Number">

</div>

        <div class="form-buttons">

          <button type="submit" id="submitBtn">Add Employee</button>
          <button type="button" id="cancelBtn" class="cancel-btn">Cancel</button>
        </div>
      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
